<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h3 {
      margin-top: 0;
      color: #818cf8;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .footer-link {
      margin-top: 12px;
      font-size: 11px;
      text-align: center;
    }
    .footer-link a {
      color: #818cf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h3>⚡ Smart Markdown Web Scraper</h3>
  <label style="font-size: 11px; color: #94a3b8;">RapidAPI Key:</label>
  <input type="password" id="apiKey" placeholder="Enter your RapidAPI Key">
  <button id="btnScrape">Copy Current Page as Markdown</button>
  <div id="status">Ready</div>
  <div class="footer-link">
    Need a key? <a href="https://rapidapi.com/modialmadih/api/smart-markdown-web-scraper" target="_blank">Get Key on RapidAPI</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
